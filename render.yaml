services:
  - type: web
    name: seo-pulse
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CF_ACCESS_ENABLED
        value: "false"
      - key: APP_BASIC_AUTH_ENABLED
        value: "true"
      - key: APP_BASIC_AUTH_USERNAME
        value: seo-pulse
      - key: APP_BASIC_AUTH_PASSWORD
        sync: false
